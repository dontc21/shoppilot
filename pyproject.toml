[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shoppilotbot"
version = "0.1.0"
description = "A small, local-first AI customer service assistant for learning and demos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.48,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
